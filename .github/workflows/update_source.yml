name: Update AltStore Source

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-source:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Record job start time
      id: job_start_time
      run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Get latest commit info
      id: commit_info
      run: |
        COMMIT_SHA=$(git rev-list -n 1 HEAD)
        COMMIT_MSG=$(git log -1 --pretty=%s)
        echo "commit_sha=$COMMIT_SHA" >> $GITHUB_ENV
        echo "commit_msg=$COMMIT_MSG" >> $GITHUB_ENV

    - name: Update AltStore source
      id: update_source
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python .github/update_json.py

    - name: Upload source JSONs to the triggering release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.event.release.tag_name }}"
        if [ -z "$TAG" ]; then
          TAG=$(gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.draft == false and .prerelease == false and .tag_name != "nightly")][0].tag_name // empty')
        fi
        # Idempotent upload: delete any same-named asset first and wait until the
        # name is actually freed, then upload the fresh copy. A bare
        # `gh release upload --clobber` races GitHub's asynchronous asset
        # deletion and can fail with 422 "ReleaseAsset.name already exists"
        # (seen on the v1.0.1 run) even though the content is fine.
        REPO="${{ github.repository }}"
        RELEASE_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id')
        upload_one() {
          local file="$1"
          local name=$(basename "$file")
          local attempt asset_id wait_i remaining
          for attempt in 1 2 3; do
            asset_id=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq "[.[] | select(.name == \"$name\")][0].id // empty")
            if [ -n "$asset_id" ]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$asset_id"
              for wait_i in $(seq 1 12); do
                remaining=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq "[.[] | select(.name == \"$name\")][0].id // empty")
                if [ -z "$remaining" ]; then
                  break
                fi
                sleep 5
              done
            fi
            if gh release upload "$TAG" "$file"; then
              return 0
            fi
            sleep 5
          done
          echo "ERROR: failed to upload $name after multiple attempts" >&2
          return 1
        }
        upload_one .github/apps.json
        upload_one .github/apps_ss_lc.json
        upload_one .github/apps_lc.json

    - name: Calculate job duration
      id: duration
      if: always()
      run: |
        end_time=$(date +%s)
        duration=$((end_time - ${{ steps.job_start_time.outputs.start_time }}))
        echo "duration=$duration seconds" >> $GITHUB_OUTPUT

    - name: Create job summary
      run: |
        if [[ "${{ steps.update_source.outputs.changes }}" == "true" ]]; then
          echo "## Update Altstore Source Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "✅ Changes Detected and Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The apps.json file has been updated with the latest release information." >> $GITHUB_STEP_SUMMARY
        else
          echo "## Update Altstore Source Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "🔍 No Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The apps.json file is up to date. No changes were necessary." >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🕐 Execution Time" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "This job took ${{ steps.duration.outputs.duration }} to complete." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📆 Next Scheduled Run" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The next scheduled run will be tomorrow at midnight UTC." >> $GITHUB_STEP_SUMMARY
