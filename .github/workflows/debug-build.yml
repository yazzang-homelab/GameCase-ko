name: Debug Build (temporary)
on:
  push:
    branches: [feat/launch-animations]
  workflow_dispatch:
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Compile LiveContainerShared only (raw log)
        run: |
          xcodebuild build -project LiveContainer.xcodeproj -target LiveContainerShared -sdk iphoneos -arch arm64 -configuration Release > /tmp/build-raw.log 2>&1
          ec=$?
          echo "xcodebuild exit: $ec"
          grep -E "error:" /tmp/build-raw.log | head -60
          grep -c "Compiling LCBootstrap" /tmp/build-raw.log || true
          exit $ec
