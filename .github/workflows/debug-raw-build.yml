name: Debug Build (temporary)
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Archive with raw log
        run: |
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release > buildlog.txt 2>&1 || true
          echo "===== error lines ====="
          grep -n "error:" buildlog.txt | head -60
          echo "===== done ====="
